engine: "microvm"
image: nixos

dependencies:
  - go
  - docker
  - cosign
  - gcc
  - curl

environment:
  CGO_ENABLED: 1
  ATCR_USER: bunniesin.space

virtualisation:
  docker: true

when:
  - event: ["push"]
    tag: ["v*"]

cache:
  - key: go-mod
    hash:
      - go.sum
      - go.mod
    paths:
      - .gocache

steps:
  - name: "setup atcr credential helper"
    command: |
     set -euo pipefail
     curl -fsSL atcr.io/static/install.sh | bash
     touch << 'EOF' > ~/.docker/config.json
     {
       "credHelpers": {
         "atcr.io": "atcr"
       }
     }
     EOF
  - name: "build and push to atcr"
    command: |
      set -euo pipefail
      echo "$ATP_APP_PASSWORD" | docker login atcr.io -u "$ATCR_USER" --password-stdin

      image_tagged="atcr.io/$ATCR_USER/tempstore:$TANGLED_REF_NAME"
      image_latest="atcr.io/$ATCR_USER/tempstore:latest"
      docker build -t "tempstore:$TANGLED_REF_NAME" -t "$image_tagged" -t "$image_latest"
      docker push "$image_tagged"
      docker push "$image_latest"

      # Sign both registry references with the configured Cosign key.
      cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$image_tagged"
      cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$image_latest"
