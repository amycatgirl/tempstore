name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o "dist/tempstore-${GITHUB_REF_NAME}-linux-amd64" ./cmd/tempstore
          tar -C dist -czf "dist/tempstore-${GITHUB_REF_NAME}-linux-amd64.tar.gz" "tempstore-${GITHUB_REF_NAME}-linux-amd64"
          sha256sum "dist/tempstore-${GITHUB_REF_NAME}-linux-amd64.tar.gz" > "dist/tempstore-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
