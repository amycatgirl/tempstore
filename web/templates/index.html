<!doctype html>
<html>

<head>
  <title>Tempstore</title>
  <link rel="icon" href="/static/assets/icon.png" type="image/png" />
  <link rel="stylesheet" href="/static/ui.css" />
</head>

<body>
  <main>
    <header>
      <h1>Tempstore</h1>
    </header>
    <div class="container">
      <form class="centre" action="/api/upload" method="post" enctype="multipart/form-data">
        <div class="centre uploadbox">
          <label for="file" tabindex="0">Choose a file to upload</label>
          <input required type="file" id="file" name="file" />
        </div>
        <div class="centre storefor">
          <label for="until">Store for:</label>
          <br />
          <div class="centre time">
            <input type="range" min="1" max="5" id="until" name="until" list="ranges" value="1" />
            <datalist id="ranges">
              <option value="1">1h</option>
              <option value="2">2h</option>
              <option value="3">3h</option>
              <option value="4">4h</option>
              <option value="5">5h</option>
            </datalist>
          </div>
        </div>

        <button>Upload</button>
      </form>
    </div>

    <footer class="centre">
      <p>Made with love by <a href="https://github.com/amycatgirl">Amelia</a></p>
      <p>Licensed under the MIT license, source available on <a
          href="https://tangled.org/did:plc:sdg4fsumzoev7h2hn3scq4zz">Tangled</a></p>
    </footer>
  </main>
</body>

</html>
